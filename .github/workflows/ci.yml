name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2025-08-04
          override: true

      - name: Build
        run: |
          cargo build --release --verbose

      - name: Test
        run: |
          cargo test --release --verbose
